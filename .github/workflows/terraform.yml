name: Terraform Azure

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - run: terraform init -input=false
      - run: terraform validate
      - run: terraform plan -input=false

  apply:
    name: Terraform Apply (après approbation manuelle)
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Point 15 : l'environnement "production" a des "Required reviewers".
    # Le job attend la validation manuelle avant de s'exécuter.
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve